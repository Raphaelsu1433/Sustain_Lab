<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 列印參數建議</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="banner">
      <h1>3D 列印參數建議</h1>
    </header>

    <!-- 第一格：列印選項 -->
    <section class="card" aria-labelledby="opt-title">
      <h2 class="card-title" id="opt-title">列印選項</h2>
      <div class="card-body">
        <div class="row">
          <label for="material">材料類型</label>
          <select id="material"></select>
        </div>

        <div class="row">
          <label for="machine">使用機器</label>
          <div class="machine-wrap">
            <select id="machine"></select>
            <figure class="machine-figure">
              <img id="machine-img" src="" alt="">
              <figcaption id="machine-caption"></figcaption>
            </figure>
          </div>
        </div>

        <div class="row">
          <label for="task">任務需求</label>
          <select id="task"></select>
        </div>

        <div class="row">
          <span class="label">目標權重</span>
          <output id="weight" class="value-box"></output>
        </div>

        <details class="specimen" open>
          <summary>試片尺寸定義（W、OW、OL、T）</summary>
          <svg id="specimen-svg" viewBox="0 0 640 230" role="img" aria-label="拉伸試片尺寸示意圖：W 為窄段寬度、OW 為整體寬度、OL 為整體長度、T 為厚度">
            <defs>
              <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
              </marker>
            </defs>
            <!-- 試片外形 -->
            <path class="shape" d="M90,50 H190 A40,40 0 0 0 230,90 H370 A40,40 0 0 0 410,50 H510 V170 H410 A40,40 0 0 0 370,130 H230 A40,40 0 0 0 190,170 H90 Z"/>
            <rect class="shape" x="565" y="50" width="22" height="120"/>

            <!-- W：窄段寬度 -->
            <g class="dim" data-dim="W">
              <line x1="300" y1="56" x2="300" y2="90" marker-end="url(#arr)"/>
              <line x1="300" y1="164" x2="300" y2="130" marker-end="url(#arr)"/>
              <text x="300" y="44" text-anchor="middle">W</text>
            </g>
            <!-- OW：整體寬度 -->
            <g class="dim" data-dim="OW">
              <line x1="60" y1="50" x2="60" y2="170" marker-start="url(#arr)" marker-end="url(#arr)"/>
              <line class="ext" x1="54" y1="50" x2="90" y2="50"/>
              <line class="ext" x1="54" y1="170" x2="90" y2="170"/>
              <text x="44" y="115" text-anchor="end">OW</text>
            </g>
            <!-- OL：整體長度 -->
            <g class="dim" data-dim="OL">
              <line x1="90" y1="205" x2="510" y2="205" marker-start="url(#arr)" marker-end="url(#arr)"/>
              <line class="ext" x1="90" y1="176" x2="90" y2="212"/>
              <line class="ext" x1="510" y1="176" x2="510" y2="212"/>
              <text x="300" y="226" text-anchor="middle">OL</text>
            </g>
            <!-- T：厚度 -->
            <g class="dim" data-dim="T">
              <line x1="535" y1="32" x2="565" y2="32" marker-end="url(#arr)"/>
              <line x1="617" y1="32" x2="587" y2="32" marker-end="url(#arr)"/>
              <line class="ext" x1="565" y1="26" x2="565" y2="50"/>
              <line class="ext" x1="587" y1="26" x2="587" y2="50"/>
              <text x="576" y="20" text-anchor="middle">T</text>
            </g>
          </svg>
        </details>
      </div>
    </section>

    <!-- 第二格：建議列印參數 -->
    <section class="card" aria-labelledby="param-title">
      <h2 class="card-title" id="param-title">建議列印參數</h2>
      <div class="card-body" aria-live="polite">
        <div class="row"><span class="label">噴頭溫度（°C）</span><output id="p-nozzle" class="value-box"></output></div>
        <div class="row"><span class="label">列印速度（mm/s）</span><output id="p-speed" class="value-box"></output></div>
        <div class="row"><span class="label">層厚（mm）</span><output id="p-layer" class="value-box"></output></div>
        <div class="row"><span class="label">熱床溫度（°C）</span><output id="p-bed" class="value-box"></output></div>
        <div class="row"><span class="label">風扇轉速（%）</span><output id="p-fan" class="value-box"></output></div>
      </div>
    </section>

    <!-- 第三格：優化說明／備註 -->
    <section class="card" aria-labelledby="note-title">
      <h2 class="card-title" id="note-title">優化說明／備註</h2>
      <div class="card-body">
        <div id="notes" class="notes"></div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
